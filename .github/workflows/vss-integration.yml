name: CI Checks - VSS Integration Tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ldk-node
      - name: Checkout VSS
        uses: actions/checkout@v6
        with:
          repository: lightningdevkit/vss-server
          path: vss-server

      - name: Build and Deploy VSS Server
        run: |
          cd vss-server
          cargo run server/vss-server-config.toml&
      - name: Run VSS Integration tests
        run: |
          cd ldk-node
          export TEST_VSS_BASE_URL="http://localhost:8080/vss"
          RUSTFLAGS="--cfg vss_test" cargo test io::vss_store
          # cycle_tests is intentionally omitted on this branch: it pulls in the
          # published ldk-node 0.6.2/0.7.0 migration dev-deps, which do not
          # compile against the pinned carlaKC lightning fork. The real VSS
          # integration tests (channel_full_cycle_with_vss_store, vss_node_restart)
          # do not depend on cycle_tests and run as normal.
          RUSTFLAGS="--cfg vss_test" cargo test --test integration_tests_vss
